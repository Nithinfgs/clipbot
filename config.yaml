detector:
  tick_s: 1.0
  window_s: 5                 # rolling window for rate/unique counts
  ewma_halflife_s: 300
  warmup_s: 180
  cooldown_s: 75
  sustain_s: 2
  raid_suppress_s: 60
  weights: {unique_z: 1.0, rate_z: 0.5, emote_flood: 3.0, audio_spike: 0.8}
  threshold: {A: 4.0, B: 4.0, C: 4.5}
  min_threshold: 2.5          # auto-tune floor
  max_threshold: 9.0
  bots: [nightbot, streamelements, moobot, fossabot, streamlabs, wizebot, botrixoficial, sery_bot, soundalerts, kofistreambot]
  hype_lexicon: [KEKW, LUL, LULW, OMEGALUL, LMAO, LMFAO, LOL, W, L, "???", "no way", NOWAY, CLIP, "clip it", "💀", "😭", "😂", Pog, PogChamp, POGGERS, PogU, monkaS, monkaW, Sadge, ICANT, "HUH", "WHAT", "OMG", "BRO", "NAHH", "LMAOOO", Clueless, Aware, catJAM, EZ]

clip:
  wait_after_peak_s: 10
  pre_s: 22
  post_s: 8
  vod_latency_s: 8            # measured 7.7s: live receive lags VOD PROGRAM-DATE-TIME (audio xcorr, kaicenat)

buffer:
  segment_s: 6
  keep_s: 240

# ---- community rules (from owner, 2026-11-19) ----
rules:
  caption_must_credit: true        # creator, which stream, when; tag when IG handle verified (streamers[].ig)
  caption_no_vulgar: true          # enforced by clipbot/captions.py word filter (video content itself unrestricted)
  hashtags: any                    # rotate 3-6, never identical sets back-to-back
  watermark: account_handle        # edit: just show the posting account
  activity_csv: logs/activity.csv  # every action logged

storage:
  clips_max_gb: 60                 # clips/ folder cap; oldest deleted first when over
  min_free_gb: 15                  # also delete oldest-first if disk free drops below this

# ---- Instagram accounts (env: IG_USER_ID_n / IG_TOKEN_n) ----  all brand-new 2026-11-18 -> 30-min ramp first 3h
accounts:
  - {name: acc1, env_index: 1, handle: vicecity.laughs,  vibe: funny,     slot_offset_min: 0,
     color: "&H0000D7FF", hashtags: ["#funny", "#gtafunny", "#lol", "#funnyclips", "#comedy"]}
  - {name: acc2, env_index: 2, handle: wast.eddaily,     vibe: fails,     slot_offset_min: 3,
     color: "&H003C3CFF", hashtags: ["#wasted", "#gtafails", "#fails", "#rage", "#ragequit"]}
  - {name: acc3, env_index: 3, handle: vice_reacts,      vibe: reactions, slot_offset_min: 6,
     color: "&H00FFC800", hashtags: ["#reaction", "#streamerreacts", "#shocked", "#noway", "#reactions"]}
  - {name: acc4, env_index: 4, handle: fivestarchaos4,   vibe: chaos,     slot_offset_min: 9,
     color: "&H00FF50C8", hashtags: ["#chaos", "#gtachaos", "#policechase", "#5stars", "#mayhem"]}
  - {name: acc5, env_index: 5, handle: vicecityclips969, vibe: best_of,   slot_offset_min: 12,
     color: "&H0050FF50", hashtags: ["#bestof", "#topclips", "#streamhighlights", "#mustwatch", "#highlights"]}

# ---- hook titles ----
hooks:
  ai: false                        # owner: no AI hook titles -> template hooks from chat reaction

# ---- roster: only clip streams that are LIVE AND PLAYING GTA 6 ----
roster:
  require_gta6: true
  other_game_hints: ["valorant", "fortnite", "minecraft", "just chatting", "league of legends", "cs2", "counter-strike",
                     "apex", "warzone", "gta 5", "gta v ", "gtav", "gta rp", "gtarp", "nopixel", "gta online", "rust",
                     "elden ring", "roblox", "chess", "overwatch", "dota", "react content", "watch party", "irl"]
  gta6_title_keywords: ["gta 6", "gta6", "gta vi", "gtavi", "gta-6", "grand theft auto vi", "grand theft auto 6",
                        "vice city", "leonida", "gta 🌴"]
  target_active: 50                # keep ~40 live GTA 6 channels in chat; fill with smaller live ones when big ones are off
  min_viewers: 300                 # don't add tiny channels (chat too thin to detect hype)
  tier_viewers: {A: 15000, B: 5000}   # discovered streams: >=15k A, >=5k B, else C
  language: en
  blocklist: [sashagrey, streamdatabase]
  blocklist_patterns: ["badge", "drop", "rewards", "farm", "24_7", "247"]
  refresh_s: 120

# ---- automatic posting (owner authorised auto-post on all 5 accounts, 2026-11-19) ----
posting:
  enabled: true
  new_account_interval_min: 30     # first 3h of the run (accounts are brand-new)
  new_account_ramp_h: 3
  interval_min: 16                 # owner: keep 16-min pace until the 45/24h cap
  cap_per_24h: 45
  stale_min: 75                    # unposted ready clips older than this are dropped
