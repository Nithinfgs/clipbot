[project]
name = "clipbot"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.44.5",
    "httpx>=0.28.1",
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.5",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "streamlink>=8.6.3",
    "websockets>=17.4",
    "yt-dlp>=2026.10.26",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
